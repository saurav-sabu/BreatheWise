[project]
name = "breathewise-backend"
version = "0.1.0"
description = "BreatheWise Urban Air Quality Assistant API"
requires-python = ">=3.11"

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.2.0,<4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
