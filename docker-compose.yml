services:
  postgres:
    image: postgres:16-alpine
    container_name: breathewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-breathewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breathewise}
      POSTGRES_DB: ${POSTGRES_DB:-breathewise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breathewise} -d ${POSTGRES_DB:-breathewise}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - breathewise-net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: breathewise-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - breathewise-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: breathewise-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-breathewise}:${POSTGRES_PASSWORD:-breathewise}@postgres:5432/${POSTGRES_DB:-breathewise}
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - breathewise-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: breathewise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - breathewise-net

volumes:
  postgres_data:
  qdrant_data:

networks:
  breathewise-net:
    driver: bridge
